# DFlash2 speculation instead of MTP. Use as an override:
#   docker compose -f glm53.yaml -f dflash2.yaml up -d
#
# DFlash2 is a separate Qwen3-based draft model that reads auxiliary hidden
# states from target layers 5, 14, 24, 33 and 42 (patches/glm53_eagle3_aux.py
# supplies them; upstream GLM5next does not). k must be 7 -- the drafter's block
# size minus one -- and the model refuses anything else.
#
# Selected with SPEC_METHOD, not through EXTRA_ARGS: EXTRA_ARGS is one string,
# and an override restating it silently drops whatever else it carried, which
# is how the fail-closed tool parser vanished from production.
services:
  glm53:
    volumes:
      - ${DFLASH_HOST_DIR:-/home/admin/models/glm-5.3-flash-dflash2}:/models/glm-5.3-flash-dflash2:ro
    environment:
      - SPEC_METHOD=dflash
      - SPEC_TOKENS=7
      - DFLASH_MODEL=/models/glm-5.3-flash-dflash2
