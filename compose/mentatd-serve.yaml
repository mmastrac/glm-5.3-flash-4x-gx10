# mentatd-serve: one OpenAI-compatible endpoint that routes by model name to
# the group serving it, and one MCP endpoint merging the per-container
# status-server MCPs (tools prefixed <group>__). A separate process from
# mentatd: the daemon never touches inference traffic. Based on
# mentatd-serve.yaml from https://github.com/mmastrac/mentat at v0.12.0; its
# GUIDE-SERVE.md has every variable.
#
#   docker compose -f compose/mentatd-serve.yaml up -d
#
# Run it on one node; the head is the usual choice. It needs to reach every
# mentatd's HTTP port (6380) and the endpoints the model announces, and
# clients reach it on SERVE_PORT (6381). It reads compose/.env like the
# other two files, and needs nothing from it.
#
# Daemons are found by their UDP announcements (port 6382), by the
# MENTAT_DAEMONS seed (the local daemon by default), and through the mesh once
# any one daemon is reached. Routing is health-gated: a group is admitted
# only while it has a running actor and its announced endpoint answers a
# /models probe. The MCP merge skips the gate, because the status server
# matters most while the engine is loading or wedged.
#
# Pinned so the project is not named after this directory ("compose").
name: mentatd-serve
services:
  mentatd-serve:
    # Registry-qualified for the same reason as mentatd.yaml, and the same
    # version as the daemons.
    image: ${MENTATD_SERVE_IMAGE:-mmastrac/mentatd-serve:0.12.0}
    container_name: mentatd-serve
    # The announced endpoints sit on host addresses that bridge networking
    # cannot reach.
    network_mode: host
    restart: unless-stopped
    # The HMAC key when it lives in a file. Point MENTAT_SECRET_HOST_FILE at
    # the key on the host and set MENTAT_SECRET_FILE=/run/mentat/secret.
    # Unset, this mounts /dev/null, which reads empty and costs nothing.
    volumes:
      - ${MENTAT_SECRET_HOST_FILE:-/dev/null}:/run/mentat/secret:ro
    environment:
      # The local seed covers a listener that missed the first
      # announcements. To the binary an empty value means no seeds. Compose
      # cannot express that, since ${VAR:-default} treats empty as unset.
      - MENTAT_DAEMONS=${MENTAT_DAEMONS:-127.0.0.1:6380}
      - SERVE_PORT=${SERVE_PORT:-6381}
      # The daemons' announcement port. 0 turns the listener off.
      - MENTAT_ANNOUNCE_PORT=${MENTAT_ANNOUNCE_PORT:-6382}
      # Empty keeps the built-in default, `local`: every network this box
      # has an interface on, loopback, and the docker bridge a
      # bridge-networked client keeps its 172.x source from. Entries may also
      # be CIDR blocks.
      - ALLOWED_SOURCES=${ALLOWED_SOURCES:-}
      # HMAC key for announcements. Set it here and on every daemon, or on
      # neither: a router holding a key accepts signed announcements only.
      - MENTAT_SECRET=${MENTAT_SECRET:-}
      # Set this to /run/mentat/secret to use the mount above. A file that
      # cannot be read, or reads empty, stops the router at boot.
      - MENTAT_SECRET_FILE=${MENTAT_SECRET_FILE:-}
      # Cluster name. Foreign universes are dropped without a log line.
      - MENTAT_UNIVERSE=${MENTAT_UNIVERSE:-}
      # Empty = 1800 s. A non-streaming answer arrives only when generation
      # ends, so this is sized for generation rather than for a hung request.
      - SERVING_TIMEOUT_S=${SERVING_TIMEOUT_S:-}
