# GLM-5.3-Flash NVFP4, TP=2 across gx10-5818 (head) + gx10-2353 (worker).
#
# Run the SAME file on both boxes; only the role differs:
#   head:   ROLE=head   NODE_RANK=0 docker compose -f glm53.yaml up -d
#   worker: ROLE=worker NODE_RANK=1 docker compose -f glm53.yaml up -d
#
# Ordering: with a mentat image (sm90-v5 onward), either side may start
# first -- registration retries forever, and the host-level mentatd
# (mentatd.yaml from https://github.com/mmastrac/mentat) just has to be
# running on both boxes. On a real-ray fallback image the old rule still
# applies: head FIRST, then wait for its stage file to read waiting-workers
# (`ray start --address` does not retry).
#
# GLM-5.3-Flash and DS4-Flash CANNOT COEXIST. GLM's weights alone are ~90.7 GiB
# per node out of 121.6 GiB, so stop ds4-flash before bringing this up.
#
# network_mode: host is required -- RoCE/NCCL needs the real interfaces, and
# Ray's actor ports are not practically mappable.
services:
  glm53:
    image: ${IMAGE:-glm53-spark:sm90-v9}
    container_name: glm53
    network_mode: host
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
      # A crash must not dump core. The engine maps ~90 GiB, and the dumping
      # thread holds the NVIDIA RM lock the whole time it writes: on
      # 2026-08-27 that turned one CUDA OOM on gx10-5818 into a box with no
      # ssh, no userspace and no way back except a power cycle, while the
      # kernel sat in nvidia_close for 860+ seconds. core_pattern on these
      # hosts is a plain file, so nothing rate-limits or discards it either.
      core: 0
    devices:
      - /dev/infiniband:/dev/infiniband
    volumes:
      # The full 181 GiB checkpoint, read-only. Unlike ds4-flash there is no
      # transcoded cache: this image loads plain safetensors, so BOTH ranks read
      # the whole checkpoint and it must be present on EACH node's local disk.
      # Local rather than NFS on purpose -- the models mount races the network at
      # boot and fails (seen on 2353 on 2026-08-26), and a model that only starts
      # when the NAS is awake will eventually fail to start.
      - ${MODEL_HOST_DIR:-/home/admin/models/glm-5.3-flash-nvfp4}:/models/glm-5.3-flash-nvfp4:ro
      # LibertAI's sparse-MLA kernel, built for sm_121a and installed to
      # /home/admin/ext. Two vllm.general_plugins entry points, both inert
      # unless their env var is set, so mounting it changes nothing on its own.
      - ${EXT_DIR:-/home/admin/ext}:/opt/ext:ro
      # JIT/autotune caches. WITHOUT this they live inside the container and are
      # discarded on every `compose down`, so FlashInfer re-autotunes and both
      # torch.compile and TileLang recompile on each restart.
      - ${CACHE_HOME:-/home/admin/container-cache}:/root/.cache
      - ${LOG_DIR:-/home/admin/logs}:/logs
    # Even under network_mode: host the container gets its OWN /etc/hosts, so
    # the host's entries are not visible here. These two names are the only
    # place the cluster's addresses are written down.
    extra_hosts:
      - "spark-head:10.100.0.2"
      - "spark-worker:10.100.0.1"
    # RULE: any knob that also has a default in entrypoint.sh is left EMPTY
    # here. A default in both places means two places to change and one
    # silently winning -- which happened repeatedly on 2026-08-27, with the
    # compose defaults from the pre-SM90 attempts quietly overriding tuned
    # values (MTP off, GPU_MEM_UTIL 0.86, MAX_MODEL_LEN 131072).
    environment:
      - ROLE=${ROLE:-head}
      - NODE_RANK=${NODE_RANK:-0}
      - SERVICE_NAME=${SERVICE_NAME:-glm53}
      - SERVED_NAME=${SERVED_NAME:-glm53}
      # mentat subcluster identity; empty = SERVICE_NAME (the entrypoint's
      # default). Set it only to run the same model as a second parallel
      # stack, which needs a distinct group per stack.
      - MENTAT_GROUP=${MENTAT_GROUP:-}
      # Both normally empty: the entrypoint derives this node's address from
      # CLUSTER_SUBNET and the head's from the spark-head name above.
      - VLLM_HOST_IP=${VLLM_HOST_IP:-}
      - RAY_ADDRESS=${RAY_ADDRESS:-}
      - CLUSTER_SUBNET=${CLUSTER_SUBNET:-10.100.0.}
      # How long to wait for the fabric and for the peer's GPUs before giving
      # up. Both default to waiting forever, because the usual reason either is
      # missing is a switch reboot, and a container that exits then just races
      # it. Set a bound only where a stuck stack must surface as a failure.
      - FABRIC_WAIT_S=${FABRIC_WAIT_S:-}
      - WORKER_WAIT_S=${WORKER_WAIT_S:-}
      # How long the RoCE device and its GID table get to appear once the
      # address is already up. Local state, so it settles in seconds or is
      # broken: this one is deliberately bounded, and the container exits so
      # the failure is visible rather than a container that waits forever.
      - ROCE_SETTLE_S=${ROCE_SETTLE_S:-}
      - HEAD_HOST=${HEAD_HOST:-spark-head}
      # NEUTRALIZED BY MENTAT (no memory monitor exists); kept for real-ray
      # fallback images, where the following still holds.
      #
      # Ray reads this name itself, so it works on an image whose baked
      # entrypoint predates the matching export in entrypoint.sh. It is the one
      # deliberate exception to the RULE above; both places resolve to 0, so
      # neither can silently win. Drop it once the image is rebuilt.
      #
      # Ray's memory monitor kills workers above 95% NODE memory, which assumes
      # host RAM and GPU memory are separate pools. On unified-memory GB10 the
      # ~89 GiB of weights ARE host memory, so a healthy loaded model sits at
      # ~95% and Ray kills rank 0 seconds after the engine comes up -- it chose
      # a 2 GB process on 2026-08-27 while the weights held the node at 115.68
      # of 121.63 GB. Logged only in the raylet event log, never in vLLM's.
      - RAY_memory_monitor_refresh_ms=${RAY_MEMORY_MONITOR_REFRESH_MS:-0}
      # LEFT EMPTY ON PURPOSE so the entrypoint derives it at start. There is
      # no correct constant: the GID table is indexed by (address, RoCE version)
      # with first-free allocation, so the index differs per node AND per boot.
      # On 2026-08-26 the right entry was 6 on 5818 and 5 on 2353, and 5818's
      # table had an empty slot 3 left by four failed DHCP cycles plus a profile
      # replacement during its 2026-08-22 boot. Reboot 5818 with the static
      # profile in place and its correct index moves 6 -> 5, so a pinned value
      # is a latent NCCL failure rather than a fix. Set it only to override.
      - NCCL_IB_GID_INDEX=${NCCL_IB_GID_INDEX:-}
      # Empty = all four RDMA devices, which is what reaches 196 Gb/s rather
      # than 112. Override only to restrict NCCL to one PCIe root.
      - NCCL_IB_HCA=${NCCL_IB_HCA:-}
      - NCCL_SOCKET_IFNAME=${NCCL_SOCKET_IFNAME:-}
      # Channel count. NCCL picks 64 here, while every published GB10 recipe
      # pins 4-12. The per-layer all-reduce is a few ms of a ~70 ms decode
      # step, so this is a prefill lever if it is anything. Empty leaves NCCL
      # to choose.
      - NCCL_MIN_NCHANNELS=${NCCL_MIN_NCHANNELS:-}
      - NCCL_MAX_NCHANNELS=${NCCL_MAX_NCHANNELS:-}
      # INFO prints the devices NCCL actually selected, which is the only way
      # to confirm both roots are in use.
      - NCCL_DEBUG=${NCCL_DEBUG:-}
      - TP=${TP:-2}
      # MTP head exists (num_nextn_predict_layers: 1). Empty here means ON at
      # k=4: entrypoint.sh defaults MTP to 1. This comment used to claim it was
      # off for the first boot, which was never true of the running config and
      # sent me hunting the wrong cause on 2026-08-27 -- the drafter's ~3.4 GiB
      # and its rejection-sampler warmup were killing rank 0. Set MTP=0 to
      # actually disable it.
      - MTP=${MTP:-}
      - SPEC_TOKENS=${SPEC_TOKENS:-}
      - MODEL_DIR=${MODEL_DIR:-/models/glm-5.3-flash-nvfp4}
      # 131072, not the model's full 1M. Weights leave ~13 GiB/node for KV,
      # activations and graphs. KV is unusually cheap here -- only 11 of 45
      # layers carry one, and they use kv_lora_rank 512 -- so this is
      # conservative rather than binding. Raise it against the measured
      # "GPU KV cache size" line at boot.
      - MAX_MODEL_LEN=${MAX_MODEL_LEN:-}
      # Per-prompt multimodal caps. Exceeding one is a clean 400 with an
      # OpenAI-shaped error body, not an engine fault, but a client that
      # treats any 400 as fatal dies on it. Raising the image cap raises the
      # peak a single request can demand: SKIP_MM_PROFILING means the vision
      # encoder is never budgeted at startup, so those bytes come out of the
      # same headroom a long prefill needs.
      - LIMIT_MM=${LIMIT_MM:-}
      - SKIP_MM_PROFILING=${SKIP_MM_PROFILING:-}
      # Empty = lazy, set in the entrypoint. eager loads faster (511 s against
      # 690) and its shard buffers are still resident when vLLM profiles, which
      # cost 38% of the KV cache. Values are lazy|eager|prefetch|torchao.
      - SAFETENSORS_LOAD_STRATEGY=${SAFETENSORS_LOAD_STRATEGY:-}
      # Which NVFP4 MoE kernel. marlin dequantises to FP16 and was adopted
      # because the native kernels produced garbage on sm_121 -- a diagnosis
      # both MiaAI-Lab and LibertAI later attributed to the checkpoint's
      # uninitialised input_scale rather than a missing kernel. Now that the
      # scales are real, the native paths are worth retrying.
      - MOE_BACKEND=${MOE_BACKEND:-}
      # The plugin's own sparse-MLA backend, replacing the SM90+FA2 route the
      # MiaAI patcher gates on. Its kernel is sized for sm_120/121's 101,376 B
      # of shared memory and measures 0.999998 against reference, where the
      # kernel it replaces measures 3.8e-3.
      - PYTHONPATH=${PYTHONPATH:-/opt/ext}
      - VLLM_GLM53_CUDA_SPARSE_MLA=${VLLM_GLM53_CUDA_SPARSE_MLA:-}
      # Deliberately NOT set: the plugin's MoE hook. It supplies a single
      # constant activation scale, and 1.0 underflows any 16-element block
      # whose amax is below 0.1 -- LibertAI retracted that fix themselves. This
      # checkpoint carries real per-projection scales.
      # - VLLM_GLM53_MOE_INPUT_SCALE
      # 0.88 is the measured ceiling under mentat (2026-08-27): CUDA-visible
      # free memory on the head is 108.0 GiB regardless of page cache, 0.90
      # wants 109.46 and failed the startup check four times, 0.88 wants
      # 107.03 and served with 0.63 GiB to spare -- KV 1,842,951 tokens vs
      # ~1.07M at the old 0.84. Under real Ray the ceiling was lower still
      # (its object store and daemons sat in this pool).
      #
      # 0.90 starts on a freshly booted box, which is the trap. It is worth
      # real KV -- 1,541,820 tokens against 1,200,343 here, +28%, because KV
      # gets only what the weights leave -- and it still must not be used: it
      # ran the driver out of memory 90 seconds into serving
      # (NV_ERR_NO_MEMORY in dmesg, hours before anything visible went wrong)
      # and both ranks died with the boxes needing a power cycle. A driver OOM
      # during startup PROFILING is normal at any setting; one during steady
      # serving is the signal.
      - GPU_MEM_UTIL=${GPU_MEM_UTIL:-}
      # Torch's caching allocator never hands a freed block back to the OS,
      # and on unified memory that block is host memory. The sparse indexer
      # scores chunk x context/kpool, so a session whose context keeps growing
      # asks for a slightly bigger block each step and strands the last one.
      # expandable_segments:True grows one segment instead of laddering.
      - PYTORCH_CUDA_ALLOC_CONF=${PYTORCH_CUDA_ALLOC_CONF:-}
      # Hard ceiling on one worker's device memory, as a fraction of the
      # 121.6 GiB. Empty leaves the worker unbounded, which is upstream's
      # behaviour. Keep it above GPU_MEM_UTIL by enough for a full prefill's
      # indexer scratch, and below 1.0 by whatever the host needs to keep
      # forking: past this a request raises OutOfMemoryError instead of the
      # node wedging.
      - TORCH_MEM_FRACTION=${TORCH_MEM_FRACTION:-}
      # Set to a writable directory to record an allocation stack per block
      # and dump a snapshot the first time the ceiling above is crossed. The
      # stack is taken in the allocating thread, so it names the caller. It
      # costs time and memory to record, so leave it empty outside an
      # investigation. /logs is already mounted and MCP-readable.
      - TORCH_MEM_TRACE_DIR=${TORCH_MEM_TRACE_DIR:-}
      # Where each worker publishes its allocator counters, which is how the
      # status page's /memory answers whether torch or something else is
      # holding the node's memory. One counter read per worker per interval,
      # so unlike the trace above this is cheap enough to leave on.
      - TORCH_MEM_STATS_DIR=${TORCH_MEM_STATS_DIR:-/logs}
      - TORCH_MEM_STATS_INTERVAL=${TORCH_MEM_STATS_INTERVAL:-}
      # Appended to the serve command verbatim. --kv-cache-memory=<bytes>
      # belongs here: it pins the pool to an absolute size instead of deriving
      # it from a fraction of whatever the device reported free at that
      # instant, which is what made the pool differ by ~0.9 GiB between
      # identical boots.
      - EXTRA_ARGS=${EXTRA_ARGS:-}
      # EMPTY = profile, which is the upstream default and what works. Pinning
      # looks like the fix for a warmup OOM and is not: vLLM then "skips memory
      # profiling" AND explicitly "does not respect the gpu_memory_utilization
      # config", so the 16%% headroom that autotune needs is discarded and it
      # OOMs harder. Set this only to force a value, never to fix an OOM --
      # lower GPU_MEM_UTIL for that.
      - KV_CACHE_MEMORY=${KV_CACHE_MEMORY:-}
      # auto (bf16), NOT fp8: fp8 selects the fp8_ds_mla packed format, which
      # hardcodes pe_dim == 64. This model is NoPE sparse MLA (qk_rope_head_dim
      # is 0), so that kernel refuses at KV cache init -- after a full 10-minute
      # weight load. Do not copy ds4-flash's fp8 here; DS4 is DeepSeek geometry.
      - KV_CACHE_DTYPE=${KV_CACHE_DTYPE:-}
      # Left EMPTY on purpose so the entrypoint owns the defaults. A default
      # here as well as there means two places to change and one silently
      # winning.
      - MAX_NUM_BATCHED_TOKENS=${MAX_NUM_BATCHED_TOKENS:-}
      # Capped by the KDA recurrent state, not by throughput. 34 of 45 layers
      # are linear attention and each keeps one fixed-size state per sequence
      # ("Mamba cache block"); exactly 32 fit after weights at GPU_MEM_UTIL
      # 0.86. vLLM's default of 256 aborts at CUDA graph capture AFTER the full
      # weight load. Empty here so the entrypoint owns the default.
      - MAX_NUM_SEQS=${MAX_NUM_SEQS:-}
      - LONG_PREFILL_TOKEN_THRESHOLD=${LONG_PREFILL_TOKEN_THRESHOLD:-}
      - DECODE_RESERVE_TOKENS=${DECODE_RESERVE_TOKENS:-}
      - CUDAGRAPH_CAPTURE_SIZES=${CUDAGRAPH_CAPTURE_SIZES:-}
      - CUDAGRAPH_METRICS=${CUDAGRAPH_METRICS:-}
      - ITERATION_DETAILS=${ITERATION_DETAILS:-}
      - API_PORT=${API_PORT:-8002}
      - STATUS_PORT=${STATUS_PORT:-8082}
      - PEERS=${PEERS:-spark-head:8082,spark-worker:8082}
      - MCP_LOG_DIR=${MCP_LOG_DIR:-/logs}
      # The agent registry keys on this. Without it the announce falls back to
      # the hostname, which under network_mode: host is the HOST's name, so
      # every container on a node would claim the same entry.
      - CONTAINER_NAME=${CONTAINER_NAME:-glm53}
      # What the agent announces to mentat-serve. Empty means the entrypoint
      # derives both from VLLM_HOST_IP, which is this node's ConnectX address
      # -- reachable from the pair and from nothing else. Set them to a LAN
      # address per node for a router that lives off that subnet. A worker
      # holds a TP rank and answers no requests, so the entrypoint drops its
      # OpenAI URL however this is set.
      - MENTAT_OPENAI_API=${MENTAT_OPENAI_API:-}
      - MENTAT_MCP_API=${MENTAT_MCP_API:-}
      - MENTAT_MODEL_PROVIDER=${MENTAT_MODEL_PROVIDER:-}
      - AGENT_URL=${AGENT_URL:-http://127.0.0.1:8090}
      - MAX_JOBS=${MAX_JOBS:-}
      - SELF_TEST=${SELF_TEST:-1}
      - THROUGHPUT_INTERVAL_S=${THROUGHPUT_INTERVAL_S:-60}
      - NVIDIA_VISIBLE_DEVICES=all
    cap_add:
      # py-spy reads the engine's Python stack without stopping it -- the only
      # instrument that can see inside a scheduler tick that never returns.
      - SYS_PTRACE
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
